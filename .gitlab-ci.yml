image: node:24-alpine
stages:
 - lint
 - build
cache:
 key:
 files:
 - package-lock.json
 paths:
 - .npm/
before_script:
 - npm ci --cache .npm --prefer-offline
lint:
 stage: lint
 script:
 - npm run lint
build:
 stage: build
 script:
 - npm run build
 artifacts:
 paths:
 - .next/
 expire_in: 1 week